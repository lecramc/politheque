# Mise à jour quotidienne des votes de l'Assemblée nationale (open data officiel).
#
# Le script réécrit toujours manifest.json (date d'extraction, empreintes des zips) : ce fichier
# change donc chaque jour même sans nouveau vote. On ne commite que si autre chose a changé
# (scrutins, index, députés) ; sinon on annule la seule variation du manifeste et on termine
# sans commit. Le préfixe `build:` n'entraîne ni bump de version ni entrée de CHANGELOG.
name: Mise à jour des votes de l'Assemblée

on:
  schedule:
    # 05:30 UTC = 06:30 ou 07:30 à Paris (tôt le matin, toute l'année)
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assemblee-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Le jeton n'est pas laissé dans la configuration git pendant les étapes qui exécutent du
          # code du dépôt ou des dépendances ; il n'est fourni qu'au push, explicitement.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Aucun script d'installation : l'extraction n'utilise que vite (+ vite-tsconfig-paths), vitest
      # et la commande système `unzip` ; le seul script `prepare` (husky) est inutile ici.
      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      - name: Mémoriser le commit de départ
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # --guard : échec, sans rien écrire, si le nombre de scrutins baisse ou si le nombre de votes
      # sans place (70 aujourd'hui, collisions de sièges de la source) augmente.
      - name: Télécharger et régénérer les données
        run: node scripts/assemblee-scrutins.mjs --download --guard

      # Suite complète : les données de l'Assemblée sont lues par d'autres pages (fiches partis, etc.).
      - name: Tests
        run: npx vitest run

      - name: Vérifier le périmètre des changements
        id: changes
        run: |
          changed="$(git status --porcelain | cut -c4-)"
          if [ -z "$changed" ]; then
            echo "Aucun changement."
            echo "commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fichiers modifiés hors du périmètre autorisé (.cache est ignoré par git)
          outside="$(echo "$changed" | grep -v -e '^src/assemblee/data/' -e '^public/donnees/assemblee/' || true)"
          if [ -n "$outside" ]; then
            echo "::error::Fichiers modifiés hors de src/assemblee/data/ et public/donnees/assemblee/ :"
            echo "$outside"
            exit 1
          fi

          # Changements réels : tout sauf le manifeste (seuls date et empreintes y varient)
          substantive="$(echo "$changed" | grep -v '^src/assemblee/data/manifest.json$' || true)"
          if [ -z "$substantive" ]; then
            echo "Seul le manifeste a changé (date d'extraction) : pas de commit."
            git checkout -- src/assemblee/data/manifest.json
            echo "commit=false" >> "$GITHUB_OUTPUT"
          else
            echo "commit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commiter et pousser
        if: steps.changes.outputs.commit == 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          date="$(TZ=Europe/Paris date +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assemblee/data public/donnees/assemblee
          git commit -m "build: hémicycle — votes de l'Assemblée au ${date}" -m "Correction-publique: aucune"

          git fetch "$REMOTE" main
          if [ "$(git rev-parse FETCH_HEAD)" != "$BASE_SHA" ]; then
            # main a avancé pendant l'extraction. Si le script, ses dépendances ou les données de
            # l'Assemblée ont changé entre-temps, ces données viennent d'un ancien script : on
            # n'y touche pas, la prochaine exécution repartira de l'état à jour.
            stale="$(git diff --name-only "$BASE_SHA" FETCH_HEAD -- scripts/assemblee-scrutins.mjs src/assemblee/models package.json package-lock.json src/assemblee/data public/donnees/assemblee || true)"
            if [ -n "$stale" ]; then
              echo "::error::main a changé pendant l'extraction (fichiers liés à l'extraction) : rien n'est poussé, relancer le workflow."
              echo "$stale"
              exit 1
            fi
            git rebase FETCH_HEAD
          fi
          git push "$REMOTE" HEAD:main
